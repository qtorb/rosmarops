name: cto57-probe (temporary, read-only, never merge)

# CTO-57: where a clean Grok Bot install on Windows keeps «Execution on this
# computer». No sign-in, no account. Prints names, sizes, key names and short
# code extracts only; token-like strings are redacted by probe.py.

on:
  push:
    branches:
      - cto/2026-11-16-cto-57-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Find the installer link
        shell: pwsh
        run: python .github/cto57/find.py
      - name: Snapshot before install
        shell: pwsh
        run: |
          python .github/cto57/probe.py snap "$env:RUNNER_TEMP\s0.json"
          reg query HKCU\Software > "$env:RUNNER_TEMP\reg0.txt"
      - name: Download, verify and install silently
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\grokbot-setup.exe"
          Invoke-WebRequest $env:GB_URL -OutFile $exe -UseBasicParsing
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "installer $env:GB_URL size $((Get-Item $exe).Length) sha256 $h"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "signature: $($sig.Status) signer: $($sig.SignerCertificate.Subject)"
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "version info: $($vi.ProductName) $($vi.ProductVersion) $($vi.CompanyName) $($vi.FileDescription)"
          $p = Start-Process $exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Host "installer still running after 300 s"; Stop-Process -Id $p.Id -Force }
          Write-Host "installer exit $($p.ExitCode)"
          Start-Sleep 10
          Get-Process | Where-Object { $_.Path -and $_.Path -match '(?i)grok' } | ForEach-Object { Write-Host "running after install: $($_.Path)" }
      - name: Snapshot after install
        shell: pwsh
        run: |
          python .github/cto57/probe.py snap "$env:RUNNER_TEMP\s1.json"
          python .github/cto57/probe.py diff "$env:RUNNER_TEMP\s0.json" "$env:RUNNER_TEMP\s1.json" "after install" | Select-Object -First 400
          reg query HKCU\Software > "$env:RUNNER_TEMP\reg1.txt"
          Compare-Object (Get-Content "$env:RUNNER_TEMP\reg0.txt") (Get-Content "$env:RUNNER_TEMP\reg1.txt") | ForEach-Object { Write-Host "reg $($_.SideIndicator) $($_.InputObject)" }
          $dirs = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { $_.Name -match '(?i)grok' }
          if (-not $dirs) { $dirs = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Directory | Where-Object { $_.Name -match '(?i)grok' } }
          $dirs | ForEach-Object { Write-Host "install dir: $($_.FullName)" }
          "GB_DIR=$($dirs[0].FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Extract the app code and search for where the setting is stored
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\asar"
          npx --yes @electron/asar@3.2.17 extract "$env:GB_DIR\resources\app.asar" $out
          Get-ChildItem $out | ForEach-Object { Write-Host "top: $($_.Name)" }
          $env:PYTHONIOENCODING = "utf-8"
          $env:CTO57_PATS = "onLocalToolPermissionNever|||[lL]ocalToolPermission\w*|||localToolAccess\w*|||mcpBoxServers|||host-secrets\.json|||host-token\.json|||local-tool-approvals\.json|||egressTunnelEnabled:|||webauthnProxyEnabled"
          $env:CTO57_MAX = "4"
          $env:CTO57_W = "1500"
          python .github/cto57/deep.py $out | Select-Object -First 900
