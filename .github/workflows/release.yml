# Release of RosmarOps (decision 2026-10-24, distribución, CTO-8 and CTO-8b):
# only on a tag v*; the checks the repository requires, a Windows build,
# rosmarops.exe alone (decision 2026-10-27, primer uso con un solo .exe),
# the macOS preview's rosmarops-macos-apple-silicon and rosmarops-macos-intel
# (decision 2026-10-29, macOS vista previa, point 6), each checked so the
# network enters only through internal/spacenet (invariant 1, option B),
# their SHA256SUMS.txt, a build provenance attestation and the
# GitHub release. A tag with a hyphen (v0.5.0-alpha.1) is published as a
# prerelease, never «latest» (.github/scripts/release-flags.sh). BV-112:
# then the released rosmarops.exe, checked against SHA256SUMS.txt, makes the
# sample report on Windows (scripts/sample-report/generate.ps1), and its
# English and Spanish pages are added to the release.
#
# Third-party actions are pinned by commit SHA (the tag in the comment).
# The release is created with the GitHub CLI that the runner ships with.
# BV-127: it can also be started by hand (Run workflow) with a tag; the
# workflow creates the tag on master after its checks.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create on master, for example v0.6.0"
        required: true
        type: string

permissions: {}

jobs:
  tag:
    # Manual «Run workflow» only (BV-127): a tag push skips this job. It checks
    # the request and creates the tag on master. A tag pushed with GITHUB_TOKEN
    # does not start another workflow run, so there is no double publish.
    # actions: read lets check e read ci.yml's runs; without it the API 403s.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Check the request and create the tag on master
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # a. publish only from master
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "Run workflow only from master (got ${{ github.ref }})"; exit 1
          fi
          # b. tag format vX.Y.Z or vX.Y.Z-prerelease
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Invalid tag \"$TAG\": want vX.Y.Z or vX.Y.Z-prerelease"; exit 1
          fi
          # c. the tag must not exist yet
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"; exit 1
          fi
          # d. the release note must exist at this commit
          if [ ! -s "docs/release-notes/${TAG}.md" ]; then
            echo "No docs/release-notes/${TAG}.md at ${SHA}"; exit 1
          fi
          # e. the checks workflow (ci.yml) must be green on this commit
          green=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${green:-0}" -lt 1 ]; then
            echo "The checks workflow (ci.yml) is not green on ${SHA}"; exit 1
          fi
          # all checks passed: create and push the annotated tag with GITHUB_TOKEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "RosmarOps $TAG"
          git push origin "refs/tags/$TAG"

  verify:
    needs: [tag]
    # Runs after a successful manual tag, or directly on a tag push (tag
    # skipped). A failed tag job (a check did not pass) skips verify and
    # everything after it, so nothing is published.
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install mvdan.cc/gofumpt@v0.7.0
      - name: Strace for the runtime network trust test
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: go vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: staticcheck
        run: staticcheck ./... && GOOS=windows staticcheck ./... && GOOS=darwin staticcheck ./...
      - name: gofumpt
        run: test -z "$(gofumpt -l .)"
      - name: Release flags (a tag with a hyphen is a prerelease, not latest)
        run: |
          test "$(sh .github/scripts/release-flags.sh v0.5.0-alpha.1)" = "--prerelease --latest=false"
          test "$(sh .github/scripts/release-flags.sh v0.5.0)" = "--latest"
      - name: go test (trust tests included)
        run: go test -count=1 ./...

  release:
    needs: verify
    # Explicit so a skipped «tag» (on a tag push) does not cascade a skip
    # down the needs chain: run whenever verify actually succeeded.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Release note
        run: |
          test -s "docs/release-notes/${TAG}.md" || { echo "no release note docs/release-notes/${TAG}.md"; exit 1; }
      - name: Build rosmarops.exe
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist/pkg
          go build -trimpath -ldflags="-X main.version=${TAG#v}" -o dist/pkg/rosmarops.exe ./cmd/rosmarops
      - name: Build rosmarops-macos-apple-silicon and rosmarops-macos-intel
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
        run: |
          for arch in arm64 amd64; do
            case $arch in
              arm64) name=rosmarops-macos-apple-silicon ;;
              amd64) name=rosmarops-macos-intel ;;
            esac
            GOARCH=$arch go build -trimpath -ldflags="-X main.version=${TAG#v}" -o "dist/pkg/$name" ./cmd/rosmarops
          done
      - name: Network only through internal/spacenet
        run: |
          go test ./tests/trust -count=1 -run '^TestNoNetwork_(OnlySpacenetImportsNetwork|NetworkPackagesOnlyViaSpacenet|NoDirectSocketCalls|ChecksCatch|BinaryPinsHostAgainstLdflags)$' -v
      - name: Checksums
        run: |
          cd dist
          cp pkg/rosmarops.exe pkg/rosmarops-macos-apple-silicon pkg/rosmarops-macos-intel .
          sha256sum rosmarops.exe rosmarops-macos-apple-silicon rosmarops-macos-intel > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/rosmarops.exe
            dist/rosmarops-macos-apple-silicon
            dist/rosmarops-macos-intel
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=$(sh .github/scripts/release-flags.sh "${TAG}")
          # shellcheck disable=SC2086 # the flags are words
          gh release create "${TAG}" \
            dist/rosmarops.exe dist/rosmarops-macos-apple-silicon dist/rosmarops-macos-intel dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --title "RosmarOps ${TAG}" --notes-file "docs/release-notes/${TAG}.md" --verify-tag ${flags}

  sample-report:
    needs: release
    # Explicit, for the same reason as release: run whenever release succeeded.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Download the released rosmarops.exe
        run: |
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --pattern rosmarops.exe --pattern SHA256SUMS.txt --dir dist
          $want = (Select-String -Path dist/SHA256SUMS.txt -Pattern '^([0-9a-f]{64})\s+\*?rosmarops\.exe$').Matches[0].Groups[1].Value
          $got = (Get-FileHash -Algorithm SHA256 -Path dist/rosmarops.exe).Hash.ToLowerInvariant()
          if (-not $want -or $got -ne $want) { throw "rosmarops.exe SHA-256 $got does not match SHA256SUMS.txt ($want)" }
      - name: Sample report
        run: ./scripts/sample-report/generate.ps1 -Exe dist/rosmarops.exe
      - name: Add the sample report to the release
        run: gh release upload "$env:TAG" dist/sample-report.en.html dist/sample-report.es.html --repo "$env:GITHUB_REPOSITORY" --clobber
