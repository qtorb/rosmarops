# journeys: the journey tests (CTO-74). This first version holds only the
# probe of point 0, run by hand: whether the machines can reproduce what a
# person sees. Nothing here builds or publishes RosmarOps.
#   - ubuntu-24.04: snapd starts, `snap install firefox` finishes, and inside
#     the snap's confinement a file under a hidden folder of the home is not
#     readable while the same file in a visible folder is (the control). A
#     headless screenshot of each file is taken too, as a complement.
#   - windows-latest: the test-signed MSIX that msix.yml builds installs with
#     Add-AppxPackage once its certificate is trusted, and runs through its
#     alias.
# Each check writes one line to the job summary. The job fails if a check the
# journeys depend on fails; a screenshot that is not taken does not fail it.
name: journeys

on:
  workflow_dispatch:
    inputs:
      msix_run:
        description: "msix.yml run whose test package is installed (its artifact must still exist)"
        required: false
        default: "44391502775"
        type: string
      msix_version:
        description: "Version of that package"
        required: false
        default: "0.15.0"
        type: string

permissions: {}

jobs:
  probe-snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: snapd and the Firefox snap
        id: snap
        shell: bash
        run: |
          set -u
          ok() { echo "- ✅ $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          ko() { echo "- ❌ $1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
          echo "### ubuntu-24.04 · snap" >> "$GITHUB_STEP_SUMMARY"
          if snap version; then ok "snapd answers (\`snap version\`)"; else ko "snapd does not answer"; exit 0; fi
          if timeout 900 sudo snap install firefox; then ok "\`snap install firefox\` finished"; else ko "\`snap install firefox\` did not finish"; exit 0; fi
          if snap list firefox; then ok "\`snap list firefox\` lists the snap"; else ko "\`snap list firefox\` does not list it"; fi
          echo "firefox on PATH: $(command -v firefox || echo none) -> $(readlink -f "$(command -v firefox)" 2>/dev/null || true)"

      - name: Read check inside the snap, with its control
        shell: bash
        run: |
          set -u
          ok() { echo "- ✅ $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          ko() { echo "- ❌ $1" | tee -a "$GITHUB_STEP_SUMMARY"; echo fail > "$RUNNER_TEMP/gate"; }
          hidden="$HOME/.rosmarops/reports/probe.html"
          control="$HOME/RosmarOpsControl/probe.html"
          mkdir -p "$(dirname "$hidden")" "$(dirname "$control")"
          printf '<!doctype html><title>probe</title><h1>RosmarOps probe</h1>\n' > "$hidden"
          cp "$hidden" "$control"
          if snap run --shell firefox -c "test -r '$control'"; then
            ok "control: \`~/RosmarOpsControl/probe.html\` readable inside the snap"
          else
            ko "control: \`~/RosmarOpsControl/probe.html\` NOT readable inside the snap (the machine is not valid)"
          fi
          if snap run --shell firefox -c "test -r '$hidden'"; then
            ko "hidden: \`~/.rosmarops/reports/probe.html\` readable inside the snap (expected not readable)"
          else
            ok "hidden: \`~/.rosmarops/reports/probe.html\` not readable inside the snap, as expected"
          fi

      - name: Headless screenshots (complement, never fails the job)
        shell: bash
        run: |
          set -u
          line() { echo "- $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          shot() {
            out="$HOME/RosmarOpsControl/$1.png"
            rm -f "$out"
            timeout 180 snap run firefox --headless --screenshot "$out" "file://$2" > "$RUNNER_TEMP/$1.log" 2>&1
            echo "exit $?" >> "$RUNNER_TEMP/$1.log"
            if [ -s "$out" ]; then line "ℹ️ screenshot of the $1 file: taken ($(stat -c %s "$out") bytes)"; else line "ℹ️ screenshot of the $1 file: not taken"; fi
            tail -5 "$RUNNER_TEMP/$1.log"
          }
          shot control "$HOME/RosmarOpsControl/probe.html"
          shot hidden "$HOME/.rosmarops/reports/probe.html"
          mkdir -p "$RUNNER_TEMP/shots" && cp "$HOME"/RosmarOpsControl/*.png "$RUNNER_TEMP/shots/" 2>/dev/null || true

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-snap-screenshots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Result
        shell: bash
        run: |
          if [ "${{ steps.snap.outputs.gate }}" = fail ] || [ -e "$RUNNER_TEMP/gate" ]; then
            echo "a check failed"; exit 1
          fi

  probe-msix:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: The test package from msix.yml
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rosmarops-msix-${{ inputs.msix_version }}
          path: msix
          run-id: ${{ inputs.msix_run }}
          github-token: ${{ github.token }}

      - name: Trust the test certificate, install, run through the alias
        shell: powershell
        env:
          VERSION: ${{ inputs.msix_version }}
        run: |
          $fail = $false
          function Line($ok, $text) {
            $mark = if ($ok) { '✅' } else { '❌' }
            "- $mark $text" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if (-not $ok) { $script:fail = $true }
          }
          "### windows-latest · MSIX" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $msix = "msix/rosmarops-$env:VERSION-x64-test.msix"
          $cer = "msix/rosmarops-$env:VERSION-x64-test.cer"
          Line (Test-Path $msix) "test package downloaded ($msix)"
          try {
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            Line $true "certificate imported into LocalMachine\TrustedPeople"
          } catch { Line $false "certificate not imported: $($_.Exception.Message)" }
          try {
            Add-AppxPackage -Path $msix -ErrorAction Stop
            Line $true "Add-AppxPackage installed the package"
          } catch { Line $false "Add-AppxPackage failed: $($_.Exception.Message)" }
          $pkg = Get-AppxPackage | Where-Object { $_.Name -like '*RosmarOps*' }
          Line ($null -ne $pkg) "Get-AppxPackage lists it ($($pkg.PackageFullName))"
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\rosmarops.exe'
          Line (Test-Path $alias) "alias present ($alias)"
          $out = & $alias --version 2>&1 | Out-String
          Line (($LASTEXITCODE -eq 0) -and ($out -match [regex]::Escape($env:VERSION))) "alias runs: $($out.Trim())"
          if ($pkg) { Line ($pkg.InstallLocation -like '*WindowsApps*') "installed folder: $($pkg.InstallLocation)" }
          Get-AppxPackage | Where-Object { $_.Name -like '*RosmarOps*' } | Remove-AppxPackage -ErrorAction SilentlyContinue
          if ($fail) { exit 1 }
