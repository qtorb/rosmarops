# journeys: the journey tests (CTO-74). This version holds only the second
# probe of point 0, Linux only, run by hand: whether ubuntu-24.04 with the
# Firefox snap tells a file under a hidden folder of the home from the same
# file in a visible folder.
#   - The machine's confinement: snap debug confinement, AppArmor, and the
#     snap's home connection.
#   - A real open of each file inside the snap (one byte read), not test -r:
#     access() checks the file's permissions, AppArmor decides at the open.
#   - A headless screenshot of each, 60 s each, as a complement.
# The windows-latest MSIX probe passed in the first run and is not repeated.
# Each check writes one line to the job summary; the job fails if the open
# check does not tell the two files apart.
name: journeys

on:
  workflow_dispatch:
  # Temporary, for the probe only: a workflow can be dispatched only once it is
  # on the default branch, so until then a push of this file to its own branch
  # runs it. Removed before the journeys themselves are added.
  push:
    branches: [bv2-263-recorridos]
    paths: [".github/workflows/journeys.yml"]

permissions: {}

jobs:
  probe-snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: snapd and the Firefox snap
        id: snap
        shell: bash
        run: |
          set -u
          ok() { echo "- ✅ $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          ko() { echo "- ❌ $1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
          echo "### ubuntu-24.04 · snap" >> "$GITHUB_STEP_SUMMARY"
          if snap version; then ok "snapd answers (\`snap version\`)"; else ko "snapd does not answer"; exit 0; fi
          if timeout 900 sudo snap install firefox; then ok "\`snap install firefox\` finished"; else ko "\`snap install firefox\` did not finish"; exit 0; fi
          if snap list firefox; then ok "\`snap list firefox\` lists the snap"; else ko "\`snap list firefox\` does not list it"; fi
          echo "firefox on PATH: $(command -v firefox || echo none) -> $(readlink -f "$(command -v firefox)" 2>/dev/null || true)"

      - name: Confinement of this machine
        shell: bash
        run: |
          set +e
          line() { echo "- ℹ️ $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          c=$(snap debug confinement 2>&1); line "\`snap debug confinement\`: $c"
          if command -v aa-status >/dev/null; then
            sudo aa-status --enabled; line "\`aa-status --enabled\`: exit $?"
          fi
          line "\`/sys/module/apparmor/parameters/enabled\`: $(cat /sys/module/apparmor/parameters/enabled 2>&1)"
          h=$(snap connections firefox 2>&1 | grep home); line "\`snap connections firefox | grep home\`: ${h:-none}"
          true

      - name: Open check inside the snap, with its control
        shell: bash
        run: |
          set +e
          ok() { echo "- ✅ $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          ko() { echo "- ❌ $1" | tee -a "$GITHUB_STEP_SUMMARY"; echo fail > "$RUNNER_TEMP/gate"; }
          hidden="$HOME/.rosmarops/reports/probe.html"
          control="$HOME/RosmarOpsControl/probe.html"
          mkdir -p "$(dirname "$hidden")" "$(dirname "$control")"
          printf '<!doctype html><title>probe</title><h1>RosmarOps probe</h1>\n' > "$hidden"
          cp "$hidden" "$control"
          # A real open (read one byte), not test -r: access() checks only the
          # file's permissions, while AppArmor decides at the open.
          open_in_snap() { snap run --shell firefox -c "head -c1 '$1' >/dev/null" 2>&1; }
          out=$(open_in_snap "$control"); rc=$?
          if [ $rc -eq 0 ]; then
            ok "control: \`~/RosmarOpsControl/probe.html\` opens inside the snap"
          else
            ko "control: \`~/RosmarOpsControl/probe.html\` does NOT open inside the snap (exit $rc: $out); the machine is not valid"
          fi
          out=$(open_in_snap "$hidden"); rc=$?
          if [ $rc -eq 0 ]; then
            ko "hidden: \`~/.rosmarops/reports/probe.html\` opens inside the snap (expected not to)"
          else
            ok "hidden: \`~/.rosmarops/reports/probe.html\` does not open inside the snap, as expected (exit $rc: $out)"
          fi
          sudo journalctl -k --since "-2min" 2>/dev/null | grep -i 'apparmor="DENIED"' | tail -5 || true
          true

      - name: Headless screenshots (60 s each; complement, never fails the job)
        shell: bash
        run: |
          set +e
          line() { echo "- ℹ️ $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          mkdir -p "$RUNNER_TEMP/shots"
          shot() {
            out="$HOME/RosmarOpsControl/$1.png"
            rm -f "$out"
            timeout 60 snap run firefox --headless --screenshot "$out" "file://$2" > "$RUNNER_TEMP/$1.log" 2>&1
            rc=$?
            if [ -s "$out" ]; then
              cp "$out" "$RUNNER_TEMP/shots/"
              line "screenshot of the $1 file: taken ($(stat -c %s "$out") bytes, exit $rc)"
            elif [ $rc -eq 124 ]; then
              line "screenshot of the $1 file: no screenshot (60 s timeout)"
            else
              line "screenshot of the $1 file: no screenshot (exit $rc)"
            fi
            pkill -f 'firefox.*--headless' 2>/dev/null
            tail -5 "$RUNNER_TEMP/$1.log"
          }
          shot control "$HOME/RosmarOpsControl/probe.html"
          shot hidden "$HOME/.rosmarops/reports/probe.html"
          true

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-snap-screenshots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: warn
          retention-days: 14

      - name: Result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.snap.outputs.gate }}" = fail ] || [ -e "$RUNNER_TEMP/gate" ]; then
            echo "a check failed"; exit 1
          fi

