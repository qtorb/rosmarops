# Measure clean installs (BV-198 point 7, CTO-23 §3): a MANUAL workflow that, on
# a fresh windows-latest runner, installs each of the nine scored agents with its
# official installer and records the files and folders the install creates under
# %USERPROFILE%, %APPDATA% and %LOCALAPPDATA% — PATHS AND NAMES ONLY, never file
# content. One matrix job per agent, each on its own clean runner, so the lists
# do not cross-contaminate. It NEVER logs in and NEVER launches an agent: what a
# product writes only on first use therefore does not appear, and is marked
# "sin verificar" when the R2 fixture is built from these lists.
#
# This is a measurement tool, not part of a release. Run it from the Actions tab
# (Run workflow). The artifacts feed the reference-computer fixture
# (internal/report/testdata/r2) and let Albert confirm each agent's at-rest
# footprint on a real Windows machine.
#
# The installer commands are the official ones documented 2026-11-08:
#   - npm:   @anthropic-ai/claude-code, @openai/codex, @google/gemini-cli
#   - winget: Anysphere.Cursor, Microsoft.VisualStudioCode (the host for the two
#     VS Code extensions)
#   - code --install-extension: github.copilot(+ -chat), saoudrizwan.claude-dev
#   - PowerShell one-liners: grok (x.ai), hermes (nousresearch.com),
#     antigravity (antigravity.google)
# Installing a CLI or an extension needs no account; none of these log in.
# A step that fails (installer offline, id changed) does not abort the matrix:
# its artifact records the failure so the gap is visible.

name: measure-clean-installs

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  measure:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - claude-code
          - codex
          - gemini-cli
          - cursor
          - github-copilot
          - cline
          - grok-build
          - hermes
          - antigravity-cli
    steps:
      - name: Baseline snapshot (names only)
        shell: pwsh
        run: |
          # List every path under the three roots, names only, excluding volatile
          # or bulky directories so the diff stays legible. No file is opened.
          $roots = @($env:USERPROFILE, $env:APPDATA, $env:LOCALAPPDATA) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $excl = @('node_modules', '.git', 'Temp', 'Cache', 'Cache2', 'CachedData',
                    'Code Cache', 'GPUCache', 'ShaderCache', 'logs', 'crashpad',
                    '.npm', 'DawnCache', 'Service Worker')
          function Snapshot {
            Get-ChildItem -LiteralPath $roots -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object {
                $p = $_.FullName
                -not ($excl | Where-Object { $p -like "*\$_\*" -or $p -like "*\$_" })
              } | Select-Object -ExpandProperty FullName | Sort-Object
          }
          Snapshot | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\before.txt"
          Write-Host "baseline paths: $((Get-Content "$env:RUNNER_TEMP\before.txt").Count)"

      - name: Install ${{ matrix.agent }} (no login, no launch)
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          switch ("${{ matrix.agent }}") {
            "claude-code"     { npm install -g @anthropic-ai/claude-code }
            "codex"           { npm install -g @openai/codex }
            "gemini-cli"      { npm install -g @google/gemini-cli }
            "cursor"          { winget install --id Anysphere.Cursor --silent --accept-package-agreements --accept-source-agreements --disable-interactivity }
            "github-copilot"  {
              winget install --id Microsoft.VisualStudioCode --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
              code --install-extension github.copilot
              code --install-extension github.copilot-chat
            }
            "cline"           {
              winget install --id Microsoft.VisualStudioCode --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
              code --install-extension saoudrizwan.claude-dev
            }
            "grok-build"      { Invoke-RestMethod https://x.ai/cli/install.ps1 | Invoke-Expression }
            "hermes"          {
              # Hermes's official scripts/install.ps1 is a staged bootstrap; its
              # non-interactive mode is the -NonInteractive switch ("skip stages
              # that need input", scripts/install.ps1:6,33,55). A switch can't be
              # passed through `irm | iex`, so run the script as a file. It is the
              # official installer, native Windows (no WSL); no login, no launch.
              $hermesPs1 = Join-Path $env:RUNNER_TEMP 'hermes-install.ps1'
              Invoke-RestMethod https://hermes-agent.nousresearch.com/install.ps1 | Set-Content -LiteralPath $hermesPs1 -Encoding utf8
              & $hermesPs1 -NonInteractive
            }
            "antigravity-cli" { Invoke-RestMethod https://antigravity.google/cli/install.ps1 | Invoke-Expression }
          }

      - name: After snapshot and diff (names only)
        if: always()
        shell: pwsh
        run: |
          $roots = @($env:USERPROFILE, $env:APPDATA, $env:LOCALAPPDATA) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $excl = @('node_modules', '.git', 'Temp', 'Cache', 'Cache2', 'CachedData',
                    'Code Cache', 'GPUCache', 'ShaderCache', 'logs', 'crashpad',
                    '.npm', 'DawnCache', 'Service Worker')
          $after = Get-ChildItem -LiteralPath $roots -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object {
              $p = $_.FullName
              -not ($excl | Where-Object { $p -like "*\$_\*" -or $p -like "*\$_" })
            } | Select-Object -ExpandProperty FullName | Sort-Object
          $out = "$env:RUNNER_TEMP\clean-install"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $after | Set-Content -Encoding utf8 "$out\after.txt"
          $before = Get-Content "$env:RUNNER_TEMP\before.txt"
          $added = Compare-Object -ReferenceObject $before -DifferenceObject $after |
            Where-Object { $_.SideIndicator -eq '=>' } |
            Select-Object -ExpandProperty InputObject | Sort-Object
          $added | Set-Content -Encoding utf8 "$out\added.txt"
          @(
            "agent: ${{ matrix.agent }}"
            "installer outcome: ${{ steps.install.outcome }}"
            "measured: $(Get-Date -Format o)"
            "roots: $($roots -join '; ')"
            "added paths: $($added.Count)"
            "NOTE: names/paths only, no content was read. No login, no launch:"
            "what a product writes only on first use does not appear here."
          ) | Set-Content -Encoding utf8 "$out\summary.txt"
          Write-Host "added paths: $($added.Count)"

          # BV-200: the install must leave what its official installer should
          # create. An installer that leaves nothing counts as a failure.
          #
          # Two groups need more than a fixed path (reconciled on the branch
          # against a real windows-latest run, 2026-11-08):
          #  - npm CLIs (claude-code, codex, gemini-cli): the hosted runner sets
          #    npm's global prefix away from %APPDATA%\npm, so the shim is
          #    resolved through the tool name (and `npm prefix -g` as a fallback)
          #    rather than a hard-coded path.
          #  - github-copilot: Copilot and Copilot Chat now ship BUILT IN to
          #    current VS Code (the install log shows github.copilot-chat as a
          #    built-in extension), so no github.copilot-* folder is created
          #    under %USERPROFILE%\.vscode\extensions. What the installer leaves
          #    is the VS Code host itself; presence is confirmed there and the
          #    built-in status is recorded for the R2 footprint.
          $agent = "${{ matrix.agent }}"
          $expected = ""
          $present = $false
          switch ($agent) {
            { $_ -in @("claude-code", "codex", "gemini-cli") } {
              $bin = @{ "claude-code" = "claude"; "codex" = "codex"; "gemini-cli" = "gemini" }[$agent]
              $cmd = Get-Command $bin -ErrorAction SilentlyContinue
              if ($cmd) {
                $present = $true
                $expected = $cmd.Source
              } else {
                $prefix = (& npm prefix -g 2>$null)
                if ($prefix) {
                  $prefix = ("$prefix").Trim()
                  $hit = Get-ChildItem -Path (Join-Path $prefix "$bin.*") -ErrorAction SilentlyContinue | Select-Object -First 1
                  $present = [bool]$hit
                  $expected = if ($hit) { $hit.FullName } else { (Join-Path $prefix "$bin.*") }
                } else {
                  $expected = "$bin (npm global bin not found)"
                }
              }
              break
            }
            "cursor" {
              $expected = "$env:LOCALAPPDATA\Programs\cursor\Cursor.exe"
              $present = Test-Path -Path $expected
              break
            }
            "github-copilot" {
              $code = Get-Command code -ErrorAction SilentlyContinue
              if (-not $code) {
                foreach ($c in @("$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd",
                                 "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd")) {
                  if (Test-Path $c) { $code = Get-Command $c; break }
                }
              }
              $vscode = @("$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe",
                          "$env:ProgramFiles\Microsoft VS Code\Code.exe") |
                        Where-Object { Test-Path $_ } | Select-Object -First 1
              $present = [bool]$vscode -or [bool]$code
              $expected = if ($vscode) { $vscode } elseif ($code) { $code.Source } else { "Microsoft VS Code (host for the built-in Copilot extensions)" }
              if ($code) {
                $exts = & $code.Source --list-extensions 2>$null
                $copilot = @($exts | Where-Object { $_ -like 'github.copilot*' })
                Add-Content -Encoding utf8 "$out\summary.txt" "code --list-extensions (github.copilot*): $([string]::Join(', ', $copilot))"
              }
              Add-Content -Encoding utf8 "$out\summary.txt" "NOTE: Copilot and Copilot Chat ship built in to current VS Code; no github.copilot-* folder is created under .vscode\extensions."
              break
            }
            "cline" {
              $expected = "$env:USERPROFILE\.vscode\extensions\saoudrizwan.claude-dev-*"
              $present = Test-Path -Path $expected
              break
            }
            "grok-build" {
              $expected = "$env:USERPROFILE\.grok\bin\grok.exe"
              $present = Test-Path -Path $expected
              break
            }
            "antigravity-cli" {
              $expected = "$env:LOCALAPPDATA\agy\bin\agy.exe"
              $present = Test-Path -Path $expected
              break
            }
            "hermes" {
              $expected = "$env:LOCALAPPDATA\hermes"
              $present = Test-Path -Path $expected
              break
            }
          }
          Add-Content -Encoding utf8 "$out\summary.txt" "expected artifact: $expected"
          Add-Content -Encoding utf8 "$out\summary.txt" "artifact present: $present"
          if (-not $present) {
            Add-Content -Encoding utf8 "$out\summary.txt" "MISSING: the installer left no expected artifact"
            Write-Error "install of $agent left no expected artifact: $expected"
            exit 1
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-install-${{ matrix.agent }}
          path: ${{ runner.temp }}/clean-install
          if-no-files-found: error
          retention-days: 30
