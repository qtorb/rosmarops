# msix (BV-209): build the Microsoft Store MSIX packages of a released version.
# It NEVER touches release.yml, the GitHub release or winget, and it uploads
# nothing to Partner Center — Albert does that. Two triggers:
#   - workflow_dispatch (from master only): the Store build. The exe is built
#     from the released tag's source (a second checkout of refs/tags/v<version>).
#   - pull_request (packaging paths): a review build from the PR branch, so a
#     reviewer and Albert can sideload the test package before merge.
#
# Two jobs. `build` runs on ubuntu-24.04 and builds the windows exes with exactly
# release.yml's recipe and host (CGO off, -trimpath, -ldflags, winres .syso),
# so the x64 exe is byte-for-byte the released rosmarops.exe — which it verifies
# against the release SHA256SUMS.txt (exact comparison; a mismatch fails and
# prints both hashes). `package` runs on windows-latest and only packs: it needs
# the Windows SDK's MakeAppx and SignTool, which are already on the runner. No
# third-party tool is installed and no secret is used. Per architecture (x64 and
# arm64) it writes an unsigned .msix (for the Store) and a test-cert-signed .msix
# plus its .cer (to sideload); the test certificate is made in the job and never
# stored in the repo.
name: msix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to package, e.g. 0.11.0 (its tag v0.11.0 must exist). Run from master only."
        required: true
        type: string
  pull_request:
    paths:
      - "packaging/msix/**"
      - ".github/workflows/msix.yml"
      - "tools/winres/**"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || '0.11.0' }}
      GOTOOLCHAIN: local
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the request (version; dispatch only from master)
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "Run the Store build (workflow_dispatch) from master only, got '${{ github.ref }}'."; exit 1
          fi

      # Primary checkout: the ref the workflow runs on (master on dispatch, the
      # PR branch on a PR). It carries the winres tool used for every .syso.
      # Done first (before src/ exists) so its clean does not remove the tag
      # checkout below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The released tag's source, for the reproducibility check and (on a Store
      # build) the packaged exe. Checked out before Go is set up so we can read
      # the Go version the release was built with from this tag's own release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ env.VERSION }}
          path: src
          persist-credentials: false

      - name: Go version from the released tag's release.yml
        # The exe is built with the Go the release used, read from the packaged
        # tag's own release.yml — not master's. A later toolchain bump (e.g.
        # go1.27.3 -> go1.27.4 for GO-2026-6859) then never silently changes the
        # bytes, and the exact SHA comparison below keeps holding, not relaxed.
        # Fails if the tag does not pin exactly one Go version.
        run: |
          set -euo pipefail
          vers=$(grep -oE 'go-version:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' src/.github/workflows/release.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          n=$(printf '%s\n' "$vers" | grep -c . || true)
          if [ "$n" -ne 1 ]; then
            echo "tag v$VERSION release.yml pins $n distinct Go versions (want exactly 1):"; printf '%s\n' "$vers"; exit 1
          fi
          echo "GOVERSION=$vers" >> "$GITHUB_ENV"
          echo "tag v$VERSION was released with Go $vers (from its release.yml)"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GOVERSION }}"
          cache: false

      - name: Reproducible build — x64 matches the released rosmarops.exe
        # Built from the released tag's source, on ubuntu, with release.yml's
        # exact recipe, so the bytes equal the published rosmarops.exe. The
        # winres amd64 .syso is generated by the primary checkout's tool (its
        # amd64 output is byte-identical to the tag's). Exact comparison.
        run: |
          set -euo pipefail
          # Prove the Go that builds the exe is the tag's release.yml version.
          active=$(go version | grep -oE 'go[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^go//')
          echo "active Go: $active (tag v$VERSION release.yml: $GOVERSION)"
          if [ "$active" != "$GOVERSION" ]; then
            echo "active Go $active does not match the tag's release.yml ($GOVERSION); the reproducibility check would be meaningless"; exit 1
          fi
          GOOS=linux GOARCH=amd64 go run ./tools/winres -version "$VERSION" -ico src/assets/windows/rosmarops.ico -out src/cmd/rosmarops/rsrc_windows_amd64.syso
          ( cd src && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-X main.version=$VERSION" -o "$RUNNER_TEMP/repro-x64.exe" ./cmd/rosmarops )
          built=$(sha256sum "$RUNNER_TEMP/repro-x64.exe" | cut -d' ' -f1)
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          released=$(grep -E '[0-9a-fA-F]{64}[[:space:]]+\*?rosmarops\.exe$' "$RUNNER_TEMP/SHA256SUMS.txt" | grep -oE '^[0-9a-fA-F]{64}')
          echo "built    x64 rosmarops.exe SHA-256: $built"
          echo "released     rosmarops.exe SHA-256: $released"
          echo "x64 rosmarops.exe built=$built released=$released" >> "$GITHUB_STEP_SUMMARY"
          if [ "$built" != "$released" ]; then
            echo "x64 build does not reproduce the released rosmarops.exe (built $built, released $released)"; exit 1
          fi
          echo "x64 reproduces the release exactly."

      - name: Build the packaged exes (x64 and arm64)
        # Store build packages the released tag's source; the PR review build
        # packages the branch (so the test package carries the alias behaviour
        # under review). The x64 Store exe is the verified reproduction above.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then pkgsrc="src"; else pkgsrc="."; fi
          mkdir -p dist-exe/x64 dist-exe/arm64
          if [ "$pkgsrc" = "src" ]; then
            cp "$RUNNER_TEMP/repro-x64.exe" dist-exe/x64/rosmarops.exe
          else
            GOOS=linux GOARCH=amd64 go run ./tools/winres -version "$VERSION" -ico "$pkgsrc/assets/windows/rosmarops.ico" -out "$pkgsrc/cmd/rosmarops/rsrc_windows_amd64.syso"
            ( cd "$pkgsrc" && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-X main.version=$VERSION" -o "$OLDPWD/dist-exe/x64/rosmarops.exe" ./cmd/rosmarops )
          fi
          GOOS=linux GOARCH=amd64 go run ./tools/winres -version "$VERSION" -arch arm64 -ico "$pkgsrc/assets/windows/rosmarops.ico" -out "$pkgsrc/cmd/rosmarops/rsrc_windows_arm64.syso"
          ( cd "$pkgsrc" && CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-X main.version=$VERSION" -o "$OLDPWD/dist-exe/arm64/rosmarops.exe" ./cmd/rosmarops )
          ls -l dist-exe/x64 dist-exe/arm64
          # BV-222 (CTO-41 §2.2, point 1): the arm64 exe of the Store package
          # must equal the published Windows arm64 exe, when the release has
          # one; exact comparison. The release publishes no Windows arm64 exe
          # today, so the step says so and checks nothing more.
          if [ "$pkgsrc" = "src" ]; then
            arm=$(grep -E '[0-9a-fA-F]{64}[[:space:]]+\*?rosmarops-windows-arm64\.exe$' "$RUNNER_TEMP/SHA256SUMS.txt" | grep -oE '^[0-9a-fA-F]{64}' || true)
            if [ -n "$arm" ]; then
              built=$(sha256sum dist-exe/arm64/rosmarops.exe | cut -d' ' -f1)
              echo "arm64 rosmarops.exe built=$built released=$arm" >> "$GITHUB_STEP_SUMMARY"
              if [ "$built" != "$arm" ]; then
                echo "arm64 build does not reproduce the released Windows arm64 exe (built $built, released $arm)"; exit 1
              fi
              echo "arm64 reproduces the released Windows arm64 exe exactly."
            else
              echo "The release publishes no Windows arm64 exe: nothing to compare the packaged arm64 exe with." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload the built exes for the packaging job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosmarops-exes-${{ env.VERSION }}
          path: dist-exe/**
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || '0.11.0' }}
    steps:
      - name: Package version
        shell: pwsh
        run: "\"PKGVERSION=$env:VERSION.0\" | Out-File -FilePath $env:GITHUB_ENV -Append"

      # The manifest and the Store icon source (the exes come from the build job).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rosmarops-exes-${{ env.VERSION }}
          path: dist-exe

      - name: Locate the Windows SDK tools (MakeAppx, SignTool)
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10\bin'
          if (-not (Test-Path $root)) { throw "Windows SDK bin not found at $root" }
          $makeappx = Get-ChildItem -Path $root -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\makeappx.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem -Path $root -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under $root" }
          if (-not $signtool) { throw "signtool.exe not found under $root" }
          "MAKEAPPX=$($makeappx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Pack and sign (x64 and arm64)
        # Windows PowerShell 5.1: System.Drawing is built in here (not in the
        # default pwsh 7 assembly set), for resizing the icon to the Store PNGs.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/msix | Out-Null

          # One self-signed test certificate for every test package. Its subject
          # must equal the manifest Publisher. The .pfx never leaves the job.
          $publisher = 'CN=E6864926-2E32-484E-9FDB-FE93F4BF4836'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'RosmarOps MSIX test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pwd = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'test.pfx'
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfx -Password $pwd | Out-Null

          foreach ($arch in @('x64', 'arm64')) {
            Write-Output "=== $arch ==="
            $stage = Join-Path $env:RUNNER_TEMP "pkg-$arch"
            New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Assets') | Out-Null
            Copy-Item "dist-exe/$arch/rosmarops.exe" (Join-Path $stage 'rosmarops.exe')

            # Store assets from the current icon, no redesign: load the .ico and
            # resize to the sizes the Store needs (System.Drawing, in the SDK).
            Add-Type -AssemblyName System.Drawing
            $ico = [System.Drawing.Icon]::new((Resolve-Path 'assets/windows/rosmarops.ico').Path, 256, 256)
            $bmpsrc = $ico.ToBitmap()
            foreach ($a in @(@{n='Square44x44Logo.png';s=44}, @{n='Square150x150Logo.png';s=150}, @{n='StoreLogo.png';s=50})) {
              $bmp = New-Object System.Drawing.Bitmap($a.s, $a.s)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.DrawImage($bmpsrc, 0, 0, $a.s, $a.s)
              $bmp.Save((Join-Path $stage "Assets\$($a.n)"), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            }
            $bmpsrc.Dispose(); $ico.Dispose()

            # Manifest with this version and arch filled in.
            $manifestPath = Join-Path $stage 'AppxManifest.xml'
            (Get-Content packaging/msix/AppxManifest.xml -Raw).
              Replace('@VERSION@', $env:PKGVERSION).Replace('@ARCH@', $arch) |
              Set-Content $manifestPath -NoNewline

            # Validate the manifest before packaging (BV-209): well-formed XML,
            # no leftover @...@ placeholder, the desktop-namespace ExecutionAlias
            # a full-trust app needs, and the right arch/version.
            $raw = Get-Content $manifestPath -Raw
            if ($raw -match '@[A-Z]+@') { throw "manifest still has a placeholder: $($Matches[0])" }
            [xml]$doc = $raw
            $nsm = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $nsm.AddNamespace('uap3', 'http://schemas.microsoft.com/appx/manifest/uap/windows10/3')
            $nsm.AddNamespace('desktop', 'http://schemas.microsoft.com/appx/manifest/desktop/windows10')
            $alias = $doc.SelectSingleNode('//uap3:AppExecutionAlias/desktop:ExecutionAlias', $nsm)
            if (-not $alias -or $alias.Alias -ne 'rosmarops.exe') {
              throw "manifest must declare <desktop:ExecutionAlias Alias='rosmarops.exe'> inside uap3:AppExecutionAlias"
            }
            $id = $doc.Package.Identity
            if ($id.ProcessorArchitecture -ne $arch) { throw "manifest ProcessorArchitecture is '$($id.ProcessorArchitecture)', want '$arch'" }
            if ($id.Version -ne $env:PKGVERSION) { throw "manifest Version is '$($id.Version)', want '$env:PKGVERSION'" }
            Write-Output "manifest validated for $arch ($($id.Name) $($id.Version))"

            $unsigned = "dist/msix/rosmarops-$env:VERSION-$arch.msix"
            & $env:MAKEAPPX pack /o /d $stage /p $unsigned
            if ($LASTEXITCODE -ne 0) { throw "makeappx failed for $arch" }

            # A signed copy for sideloading, plus the public .cer to trust it.
            $test = "dist/msix/rosmarops-$env:VERSION-$arch-test.msix"
            Copy-Item $unsigned $test
            & $env:SIGNTOOL sign /fd SHA256 /a /f $pfx /p ([System.Net.NetworkCredential]::new('', $pwd).Password) $test
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $arch" }
            Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath "dist/msix/rosmarops-$env:VERSION-$arch-test.cer" | Out-Null
          }

          Get-ChildItem dist/msix | Select-Object Name, Length

      - name: Upload the MSIX packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosmarops-msix-${{ env.VERSION }}
          path: dist/msix/*
          if-no-files-found: error
