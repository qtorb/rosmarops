# Continuous integration of RosmarOps (BV-78): on every push to master and
# every pull request to master, the same verify job as release.yml, copied
# literally (same runner, actions pinned by commit SHA, Go 1.27.4,
# staticcheck 2026.2.2, gofumpt v0.7.0, strace, vet, staticcheck, gofumpt
# and go test in linux and windows). BV-85: pushes to bv-* branches too, and
# a verify-windows job that runs vet and the tests natively on windows-latest
# (no strace there; the runtime network trace is Linux-only). BV-98 (macOS,
# M1a): a verify-macos job that builds, vets, staticchecks and tests natively
# on macos-latest. The static network checks (no network package or symbol,
# for windows, linux and darwin) run in go test on every job; the runtime
# network trace with strace stays Linux-only, a declared limit on macOS.
# BV-102: the verify job vets and staticchecks darwin too, and checks the
# release flags of an alpha tag and a stable one. BV-112: verify-windows
# makes and checks the sample report (scripts/sample-report/generate.ps1).
# BV-136: the Windows diagnostic (BV-134) moved to diagnostic-windows.yml, run by hand.
name: ci

on:
  push:
    branches:
      - master
      - 'bv-*'
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install mvdan.cc/gofumpt@v0.7.0
      - name: Strace for the runtime network trust test
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: go vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: staticcheck
        run: staticcheck ./... && GOOS=windows staticcheck ./... && GOOS=darwin staticcheck ./...
      - name: gofumpt
        run: test -z "$(gofumpt -l .)"
      - name: Release flags (a tag with a hyphen is a prerelease, not latest)
        run: |
          test "$(sh .github/scripts/release-flags.sh v0.5.0-alpha.1)" = "--prerelease --latest=false"
          test "$(sh .github/scripts/release-flags.sh v0.5.0)" = "--latest"
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      - name: Full-machine pipeline (BV-203 E8, required on all three systems)
        run: go test -count=1 -run TestFullMachinePipeline ./tests/integration/
      - name: go test -race (schemaval differential oracle, BV-133)
        # The exhaustive mutation differential under -race is slow and grew when
        # the oracle went to 15 schemas (BV-203 E6): past 30m on the runner. Give
        # it room so a thorough gate is not cut off by the timeout.
        run: go test -race -count=1 -timeout 60m ./internal/schemaval/

  verify-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install mvdan.cc/gofumpt@v0.7.0
      - name: go vet
        run: go vet ./...
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      # BV-211b / CTO-34 §4+§5: run the stdin-bootstrap runtime proof verbosely
      # on this native Windows PowerShell 5.1 runner, so the measured command
      # line and the two runtime cases appear in the log to paste in the PR.
      - name: BV-211b window launcher proof (CTO-34 §4/§5)
        run: go test -count=1 -v -run "TestBV211b" ./cmd/rosmarops/
      - name: Full-machine pipeline (BV-203 E8, required on all three systems)
        run: go test -count=1 -run TestFullMachinePipeline ./tests/integration/
      # BV-202 C4 (CTO-28): the candidate must be built the same way as the
      # release (release.yml:144-155), which ci.yml did not do. Write the Windows
      # icon + version resource (.syso) with tools/winres first; winres -version
      # takes major.minor.patch optionally with a -prerelease/+build suffix
      # (parseVersion uses the numeric core for FIXEDFILEINFO and the whole
      # string for Product/FileVersion), so "0.10.2-rc.<short-sha>" is accepted.
      # Neither the .syso (git-ignored) nor the exe is committed.
      - name: Windows resource for the candidate (icon + version, like release.yml)
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ver = "0.10.2-rc.$sha"
          "CANDIDATE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go run ./tools/winres -version $ver
          Write-Output "candidate winres version: $ver"
      # BV-112 + BV-202 C4: the sample report, made by this commit's
      # rosmarops.exe on the fictitious computer of testdata/sample-home and
      # checked; nothing is uploaded. The two checked pages go to the log, gzip
      # and base64, one line each, for review. This build is the uploaded
      # candidate, so it uses the same command as release.yml: CGO_ENABLED=0,
      # the .syso written above, -ldflags "-X main.version=..." and -trimpath.
      # BV-210/CTO-32 C5: the candidate ALSO carries -tags demoproblem so Albert
      # can trigger a test problem with ROSMAROPS_DEMO_PROBLEM; release.yml never
      # sets this tag, so the release binary ignores the variable.
      - name: Sample report
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -tags demoproblem "-ldflags=-X main.version=$env:CANDIDATE_VERSION" -o dist/rosmarops.exe ./cmd/rosmarops
          ./scripts/sample-report/generate.ps1 -Exe dist/rosmarops.exe
          foreach ($lang in 'en', 'es') {
            $out = [System.IO.MemoryStream]::new()
            $gz = [System.IO.Compression.GZipStream]::new($out, [System.IO.Compression.CompressionLevel]::Optimal)
            $raw = [System.IO.File]::ReadAllBytes("dist/sample-report.$lang.html")
            $gz.Write($raw, 0, $raw.Length)
            $gz.Dispose()
            Write-Output "SAMPLE-REPORT-$lang $([Convert]::ToBase64String($out.ToArray()))"
          }
      # BV-202 point 10: prove the candidate carries the icon and version it
      # gets from the .syso (if the resource were missing, VersionInfo would be
      # empty). The icon travels with the same resource, so a set version means
      # the icon is embedded too.
      - name: Candidate icon and version check
        run: |
          $vi = (Get-Item dist/rosmarops.exe).VersionInfo
          $vi | Format-List ProductName, ProductVersion, FileVersion, LegalCopyright
          if (-not $vi.ProductVersion) { Write-Error "candidate has no version resource (icon/version not embedded)"; exit 1 }
          if ($vi.ProductVersion -notlike "0.10.2-rc.*") { Write-Error "ProductVersion '$($vi.ProductVersion)' is not the expected 0.10.2-rc.* (set '$env:CANDIDATE_VERSION')"; exit 1 }
          Write-Output "candidate carries icon + version $($vi.ProductVersion)"
      # BV-202 S6: govulncheck as a gate, pinned, in binary mode over the
      # Windows executable this job just built. No reachable vulnerability.
      - name: govulncheck (binary mode)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode=binary dist/rosmarops.exe
      # BV-202 point 10: on pull requests, publish that same rosmarops.exe
      # (built -trimpath, same Go version as release.yml) so Albert can run it
      # on his computer before the 0.10.2 is published.
      - name: Upload candidate rosmarops.exe (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosmarops-candidate-windows
          path: dist/rosmarops.exe
          if-no-files-found: error
          retention-days: 7

  verify-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install mvdan.cc/gofumpt@v0.7.0
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: "$(go env GOPATH)/bin/staticcheck ./..."
      # No strace on macOS: TestNoNetwork_RuntimeNoInetSockets skips here
      # (declared limit, decision 2026-10-28, macOS, M1a); the static
      # network checks run.
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      - name: Full-machine pipeline (BV-203 E8, required on all three systems)
        run: go test -count=1 -run TestFullMachinePipeline ./tests/integration/

  linux-smoke:
    # BV-165: a real Linux run of the program. It builds the Linux binary, makes
    # a fake HOME with one file per agent and a repo with a planted secret, runs
    # init/baseline/run under strace (as the runtime network trust test does),
    # and checks: exit 0, no AF_INET socket call, the Spanish report exists and
    # names Claude Code, Cursor and Hermes Agent, no full secret in any output,
    # and the weekly section (no user systemd on the runner → the no-systemd
    # text, or the Linux pitch if it is there).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Build the Linux binary
        run: CGO_ENABLED=0 GOOS=linux go build -o "$RUNNER_TEMP/rosmarops" ./cmd/rosmarops
      - name: Realistic Linux run and checks
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/rosmarops"
          H="$RUNNER_TEMP/smokehome"
          SECRET="test-SMOKEa1b2c3d4e5f6g7h8i9j0"
          mkdir -p "$H/.claude" "$H/.cursor" "$H/.config/Code/User" "$H/.hermes" "$H/projects/app"
          echo '{"permissions":{"allow":["Bash"]}}' > "$H/.claude/settings.json"
          echo '{"mcpServers":{"db":{"command":"psql"}}}' > "$H/.cursor/mcp.json"
          echo '{"terminal.integrated.env.linux":{}}' > "$H/.config/Code/User/settings.json"
          printf 'approvals:\n  mode: smart\n' > "$H/.hermes/config.yaml"
          printf 'API_KEY=%s\n' "$SECRET" > "$H/projects/app/.env"
          git -C "$H/projects/app" init -q
          git -C "$H/projects/app" -c user.email=a@b.c -c user.name=x add -A
          git -C "$H/projects/app" -c user.email=a@b.c -c user.name=x commit -qm init
          export HOME="$H" LANG=es_ES.UTF-8
          "$EXE" init --repos-under "$H/projects"
          "$EXE" baseline
          # The run under strace, like the runtime network trust test.
          trace="$RUNNER_TEMP/run.strace"
          strace -f -qq -Y -e trace=connect,sendto,sendmsg -o "$trace" "$EXE" run --lang es
          if grep -q 'AF_INET' "$trace"; then
            echo "network connection during run:"; grep 'AF_INET' "$trace"; exit 1
          fi
          R="$H"/.rosmarops/reports/report.es.html
          test -s "$R" || { echo "no Spanish report"; exit 1; }
          for a in "Claude Code" "Cursor" "Hermes Agent"; do
            grep -qF "$a" "$R" || { echo "report does not name $a"; exit 1; }
          done
          if grep -rqF "$SECRET" "$H/.rosmarops"; then
            echo "full secret leaked into an output"; exit 1
          fi
          grep -qE 'no tiene systemd de usuario|Programa una revisión cada viernes' "$R" \
            || { echo "weekly section missing (no_systemd or linux pitch)"; exit 1; }
          echo "linux-smoke OK"
