# Continuous integration of RosmarOps (BV-78): on every push to master and
# every pull request to master, the same verify job as release.yml, copied
# literally (same runner, actions pinned by commit SHA, Go 1.24.7,
# staticcheck 2025.1.1, gofumpt v0.7.0, strace, vet, staticcheck, gofumpt
# and go test in linux and windows). BV-85: pushes to bv-* branches too, and
# a verify-windows job that runs vet and the tests natively on windows-latest
# (no strace there; the runtime network trace is Linux-only). BV-98 (macOS,
# M1a): a verify-macos job that builds, vets, staticchecks and tests natively
# on macos-latest. The static network checks (no network package or symbol,
# for windows, linux and darwin) run in go test on every job; the runtime
# network trace with strace stays Linux-only, a declared limit on macOS.
# BV-102: the verify job vets and staticchecks darwin too, and checks the
# release flags of an alpha tag and a stable one. BV-112: verify-windows
# makes and checks the sample report (scripts/sample-report/generate.ps1).
name: ci

on:
  push:
    branches:
      - master
      - 'bv-*'
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install mvdan.cc/gofumpt@v0.7.0
      - name: Strace for the runtime network trust test
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: go vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: staticcheck
        run: staticcheck ./... && GOOS=windows staticcheck ./... && GOOS=darwin staticcheck ./...
      - name: gofumpt
        run: test -z "$(gofumpt -l .)"
      - name: Release flags (a tag with a hyphen is a prerelease, not latest)
        run: |
          test "$(sh .github/scripts/release-flags.sh v0.5.0-alpha.1)" = "--prerelease --latest=false"
          test "$(sh .github/scripts/release-flags.sh v0.5.0)" = "--latest"
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      - name: go test -race (schemaval differential oracle, BV-133)
        run: go test -race -count=1 ./internal/schemaval/

  verify-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install mvdan.cc/gofumpt@v0.7.0
      - name: go vet
        run: go vet ./...
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      # BV-112: the sample report, made by this commit's rosmarops.exe on
      # the fictitious computer of testdata/sample-home and checked; nothing
      # is uploaded. The two checked pages go to the log, gzip and base64,
      # one line each, for review.
      - name: Sample report
        run: |
          go build -trimpath -o dist/rosmarops.exe ./cmd/rosmarops
          ./scripts/sample-report/generate.ps1 -Exe dist/rosmarops.exe
          foreach ($lang in 'en', 'es') {
            $out = [System.IO.MemoryStream]::new()
            $gz = [System.IO.Compression.GZipStream]::new($out, [System.IO.Compression.CompressionLevel]::Optimal)
            $raw = [System.IO.File]::ReadAllBytes("dist/sample-report.$lang.html")
            $gz.Write($raw, 0, $raw.Length)
            $gz.Dispose()
            Write-Output "SAMPLE-REPORT-$lang $([Convert]::ToBase64String($out.ToArray()))"
          }

  verify-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install mvdan.cc/gofumpt@v0.7.0
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: "$(go env GOPATH)/bin/staticcheck ./..."
      # No strace on macOS: TestNoNetwork_RuntimeNoInetSockets skips here
      # (declared limit, decision 2026-10-28, macOS, M1a); the static
      # network checks run.
      - name: go test (trust tests included)
        run: go test -count=1 ./...
