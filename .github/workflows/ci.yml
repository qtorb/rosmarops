# Continuous integration of RosmarOps (BV-78): on every push to master and
# every pull request to master, the same verify job as release.yml, copied
# literally (same runner, actions pinned by commit SHA, Go 1.27.4,
# staticcheck 2026.2.2, gofumpt v0.7.0, strace, vet, staticcheck, gofumpt
# and go test in linux and windows). BV-85: pushes to bv-* branches too, and
# a verify-windows job that runs vet and the tests natively on windows-latest
# (no strace there; the runtime network trace is Linux-only). BV-98 (macOS,
# M1a): a verify-macos job that builds, vets, staticchecks and tests natively
# on macos-latest. The static network checks (no network package or symbol,
# for windows, linux and darwin) run in go test on every job; the runtime
# network trace with strace stays Linux-only, a declared limit on macOS.
# BV-102: the verify job vets and staticchecks darwin too, and checks the
# release flags of an alpha tag and a stable one. BV-112: verify-windows
# makes and checks the sample report (scripts/sample-report/generate.ps1).
# BV-136: the Windows diagnostic (BV-134) moved to diagnostic-windows.yml, run by hand.
name: ci

on:
  push:
    branches:
      - master
      - 'bv-*'
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install mvdan.cc/gofumpt@v0.7.0
      - name: Strace for the runtime network trust test
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: go vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: staticcheck
        run: staticcheck ./... && GOOS=windows staticcheck ./... && GOOS=darwin staticcheck ./...
      - name: gofumpt
        run: test -z "$(gofumpt -l .)"
      - name: Release flags (a tag with a hyphen is a prerelease, not latest)
        run: |
          test "$(sh .github/scripts/release-flags.sh v0.5.0-alpha.1)" = "--prerelease --latest=false"
          test "$(sh .github/scripts/release-flags.sh v0.5.0)" = "--latest"
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      - name: Full-machine pipeline (BV-203 E8, required on all three systems)
        run: go test -count=1 -run TestFullMachinePipeline ./tests/integration/
      - name: go test -race (schemaval differential oracle, BV-133)
        # The exhaustive mutation differential under -race is slow and grew when
        # the oracle went to 15 schemas (BV-203 E6): past 30m on the runner. Give
        # it room so a thorough gate is not cut off by the timeout.
        run: go test -race -count=1 -timeout 60m ./internal/schemaval/

  verify-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install mvdan.cc/gofumpt@v0.7.0
      - name: go vet
        run: go vet ./...
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      # BV-211b / CTO-34 §4+§5: run the stdin-bootstrap runtime proof verbosely
      # on this native Windows PowerShell 5.1 runner, so the measured command
      # line and the two runtime cases appear in the log to paste in the PR.
      - name: BV-211b window launcher proof (CTO-34 §4/§5)
        run: go test -count=1 -v -run "TestBV211b" ./cmd/rosmarops/
      - name: Full-machine pipeline (BV-203 E8, required on all three systems)
        run: go test -count=1 -run TestFullMachinePipeline ./tests/integration/
      - name: BV-230 release scripts parse (PowerShell, not run)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./.github/scripts/check-release-exe.ps1).Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; throw "check-release-exe.ps1 does not parse" }
      # CTO-38 P13 (BV-219 A): the project search over the CTO-38 §3 tree
      # (about 200,000 folders, 50 repositories). It never blocks: it leaves
      # the time and the folders read in the log, the figure the signed
      # condition asks for (more than 30 s cold on Windows goes back to Albert).
      - name: CTO-38 P13 project search benchmark (does not block)
        continue-on-error: true
        run: go test -count=1 -run "^$" -bench BenchmarkProjectsSearch -benchtime 1x ./internal/scan/projects/
      # BV-226 §0: 20 runs each of session-check and statusline, with the
      # integrity check, median and p95 in the log. It never blocks; the signed
      # limits (statusline 100 ms, session-check 500 ms p95) are read by hand.
      - name: BV-226 session-check and statusline timing (does not block)
        continue-on-error: true
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -o "$env:RUNNER_TEMP\bench-rosmarops.exe" ./cmd/rosmarops
          ./scripts/bench-agenthooks/bench.ps1 -Exe "$env:RUNNER_TEMP\bench-rosmarops.exe"
      # BV-202 C4 (CTO-28): the candidate must be built the same way as the
      # release (release.yml:144-155), which ci.yml did not do. Write the Windows
      # icon + version resource (.syso) with tools/winres first; winres -version
      # takes major.minor.patch optionally with a -prerelease/+build suffix
      # (parseVersion uses the numeric core for FIXEDFILEINFO and the whole
      # string for Product/FileVersion), so "0.10.2-rc.<short-sha>" is accepted.
      # Neither the .syso (git-ignored) nor the exe is committed.
      - name: Windows resource for the candidate (icon + version, like release.yml)
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ver = "0.10.2-rc.$sha"
          "CANDIDATE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go run ./tools/winres -version $ver
          Write-Output "candidate winres version: $ver"
      # BV-112 + BV-202 C4: the sample report, made by this commit's
      # rosmarops.exe on the fictitious computer of testdata/sample-home and
      # checked; nothing is uploaded. The two checked pages go to the log, gzip
      # and base64, one line each, for review. This build is the uploaded
      # candidate, so it uses the same command as release.yml: CGO_ENABLED=0,
      # the .syso written above, -ldflags "-X main.version=..." and -trimpath.
      # BV-210/CTO-32 C5: the candidate ALSO carries -tags demoproblem so Albert
      # can trigger a test problem with ROSMAROPS_DEMO_PROBLEM; release.yml never
      # sets this tag, so the release binary ignores the variable.
      - name: Sample report
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -tags demoproblem "-ldflags=-X main.version=$env:CANDIDATE_VERSION" -o dist/rosmarops.exe ./cmd/rosmarops
          ./scripts/sample-report/generate.ps1 -Exe dist/rosmarops.exe
          foreach ($lang in 'en', 'es') {
            $out = [System.IO.MemoryStream]::new()
            $gz = [System.IO.Compression.GZipStream]::new($out, [System.IO.Compression.CompressionLevel]::Optimal)
            $raw = [System.IO.File]::ReadAllBytes("dist/sample-report.$lang.html")
            $gz.Write($raw, 0, $raw.Length)
            $gz.Dispose()
            Write-Output "SAMPLE-REPORT-$lang $([Convert]::ToBase64String($out.ToArray()))"
          }
      # BV-202 point 10: prove the candidate carries the icon and version it
      # gets from the .syso (if the resource were missing, VersionInfo would be
      # empty). The icon travels with the same resource, so a set version means
      # the icon is embedded too.
      - name: Candidate icon and version check
        run: |
          $vi = (Get-Item dist/rosmarops.exe).VersionInfo
          $vi | Format-List ProductName, ProductVersion, FileVersion, LegalCopyright
          if (-not $vi.ProductVersion) { Write-Error "candidate has no version resource (icon/version not embedded)"; exit 1 }
          if ($vi.ProductVersion -notlike "0.10.2-rc.*") { Write-Error "ProductVersion '$($vi.ProductVersion)' is not the expected 0.10.2-rc.* (set '$env:CANDIDATE_VERSION')"; exit 1 }
          Write-Output "candidate carries icon + version $($vi.ProductVersion)"
      # BV-202 S6: govulncheck as a gate, pinned, in binary mode over the
      # Windows executable this job just built. No reachable vulnerability.
      - name: govulncheck (binary mode)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode=binary dist/rosmarops.exe
      # BV-202 point 10: on pull requests, publish that same rosmarops.exe
      # (built -trimpath, same Go version as release.yml) so Albert can run it
      # on his computer before the 0.10.2 is published.
      - name: Upload candidate rosmarops.exe (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosmarops-candidate-windows
          path: dist/rosmarops.exe
          if-no-files-found: error
          retention-days: 7

  verify-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Tools (pinned versions)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install mvdan.cc/gofumpt@v0.7.0
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: "$(go env GOPATH)/bin/staticcheck ./..."
      # No strace on macOS: TestNoNetwork_RuntimeNoInetSockets skips here
      # (declared limit, decision 2026-10-28, macOS, M1a); the static
      # network checks run.
      - name: go test (trust tests included)
        run: go test -count=1 ./...
      - name: Full-machine pipeline (BV-203 E8, required on all three systems)
        run: go test -count=1 -run TestFullMachinePipeline ./tests/integration/

  linux-smoke:
    # BV-165: a real Linux run of the program. It builds the Linux binary, makes
    # a fake HOME with one file per agent and a repo with a planted secret, runs
    # init/baseline/run under strace (as the runtime network trust test does),
    # and checks: exit 0, no AF_INET socket call, the Spanish report exists and
    # names Claude Code, Cursor and Hermes Agent, no full secret in any output,
    # and the weekly section (no user systemd on the runner → the no-systemd
    # text, or the Linux pitch if it is there). ubuntu-24.04, not -latest
    # (Ubuntu 26 since 2026-09-17): the version people run.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Build the Linux binary
        run: CGO_ENABLED=0 GOOS=linux go build -o "$RUNNER_TEMP/rosmarops" ./cmd/rosmarops
      # CTO-38 P13 (BV-219 A): the project search over the CTO-38 §3 tree
      # (about 200,000 folders, 50 repositories). It never blocks: it leaves
      # the time and the folders read in the log, the figure the signed
      # condition asks for (more than 30 s cold on Windows goes back to Albert).
      - name: CTO-38 P13 project search benchmark (does not block)
        continue-on-error: true
        run: go test -count=1 -run "^$" -bench BenchmarkProjectsSearch -benchtime 1x ./internal/scan/projects/
      - name: Realistic Linux run and checks
        shell: bash
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/rosmarops"
          H="$RUNNER_TEMP/smokehome"
          SECRET="test-SMOKEa1b2c3d4e5f6g7h8i9j0"
          mkdir -p "$H/.claude" "$H/.cursor" "$H/.config/Code/User" "$H/.hermes" "$H/projects/app"
          echo '{"permissions":{"allow":["Bash"]}}' > "$H/.claude/settings.json"
          echo '{"mcpServers":{"db":{"command":"psql"}}}' > "$H/.cursor/mcp.json"
          echo '{"terminal.integrated.env.linux":{}}' > "$H/.config/Code/User/settings.json"
          printf 'approvals:\n  mode: smart\n' > "$H/.hermes/config.yaml"
          printf 'API_KEY=%s\n' "$SECRET" > "$H/projects/app/.env"
          git -C "$H/projects/app" init -q
          git -C "$H/projects/app" -c user.email=a@b.c -c user.name=x add -A
          git -C "$H/projects/app" -c user.email=a@b.c -c user.name=x commit -qm init
          export HOME="$H" LANG=es_ES.UTF-8
          "$EXE" init --repos-under "$H/projects"
          "$EXE" baseline
          # The run under strace, like the runtime network trust test.
          trace="$RUNNER_TEMP/run.strace"
          strace -f -qq -Y -e trace=connect,sendto,sendmsg -o "$trace" "$EXE" run --lang es
          if grep -q 'AF_INET' "$trace"; then
            echo "network connection during run:"; grep 'AF_INET' "$trace"; exit 1
          fi
          R="$H"/RosmarOps/report.es.html  # the reports folder on Linux
          test -s "$R" || { echo "no Spanish report"; exit 1; }
          for a in "Claude Code" "Cursor" "Hermes Agent"; do
            grep -qF "$a" "$R" || { echo "report does not name $a"; exit 1; }
          done
          if grep -rqF "$SECRET" "$H/.rosmarops" "$H/RosmarOps"; then
            echo "full secret leaked into an output"; exit 1
          fi
          grep -qE 'no tiene systemd de usuario|Programa una revisión cada viernes' "$R" \
            || { echo "weekly section missing (no_systemd or linux pitch)"; exit 1; }
          echo "linux-smoke OK"

  # The company install scripts of docs/company/ (marked untested until the
  # pilot), run for real on GitHub's runners: install as an administrator,
  # then one review as an ordinary person with no config.json of their own,
  # which must take the company configuration, accept the binary through the
  # administrator's list on the first run, write the company summary and
  # never create config.json. The version built here must equal the scripts'
  # $version / VERSION, because it goes into binaries.sha256.
  company-scripts-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build rosmarops-linux-amd64 (version 0.11.2, as install-linux.sh)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-X main.version=0.11.2" -o "$RUNNER_TEMP/pkg/rosmarops-linux-amd64" ./cmd/rosmarops
      - name: Install with docs/company/install-linux.sh and check what it left
        shell: bash
        run: |
          set -euo pipefail
          sudo INSTALLER_PATH="$RUNNER_TEMP/pkg" sh docs/company/install-linux.sh
          ls -la /etc/rosmarops /etc/systemd/user /etc/systemd/user/timers.target.wants
          stat -c '%U %a %n' /etc/rosmarops /etc/rosmarops/company.json /etc/rosmarops/binaries.sha256 \
            /etc/systemd/user /etc/systemd/user/rosmarops-weekly.service /etc/systemd/user/rosmarops-weekly.timer \
            /usr/local/bin/rosmarops
          cat /etc/rosmarops/company.json /etc/rosmarops/binaries.sha256
          listed="$(cut -d' ' -f1 /etc/rosmarops/binaries.sha256)"
          actual="$(sha256sum /usr/local/bin/rosmarops | cut -d' ' -f1)"
          echo "listed=$listed actual=$actual"
          test "$listed" = "$actual" || { echo "binaries.sha256 does not list the installed binary"; exit 1; }
          test "$(cat /etc/rosmarops/binaries.sha256)" = "$actual  0.11.2" || { echo "binaries.sha256 line is not '<sha>  0.11.2'"; exit 1; }
          test "$(stat -c '%U %a' /etc/rosmarops)" = "root 755" || { echo "/etc/rosmarops is not root 755"; exit 1; }
          for f in /etc/rosmarops/company.json /etc/rosmarops/binaries.sha256; do
            test "$(stat -c '%U %a' "$f")" = "root 644" || { echo "$f is not root 644"; exit 1; }
          done
          test -L /etc/systemd/user/timers.target.wants/rosmarops-weekly.timer || { echo "timer not enabled globally"; exit 1; }
          sha256sum /etc/rosmarops/company.json /etc/rosmarops/binaries.sha256 > "$RUNNER_TEMP/etc-before.sha256"
      - name: A fake person with one repository and no ~/.rosmarops
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/sh fakeuser
          sudo -u fakeuser -H sh -c 'mkdir -p ~/source/demo && cd ~/source/demo && git init -q && git -c user.email=a@b -c user.name=x commit -q --allow-empty -m x'
          if sudo test -e /home/fakeuser/.rosmarops; then echo "/home/fakeuser/.rosmarops already exists"; exit 1; fi
      - name: First unattended review as that person (company configuration, first run)
        shell: bash
        run: |
          set +e
          sudo -u fakeuser -H /usr/local/bin/rosmarops run --unattended
          rc=$?
          set -euo pipefail
          echo "exit code: $rc (recorded, not required to be 0)"
          S=/home/fakeuser/RosmarOps/data/rosmarops-summary.json
          sudo test -f "$S" || { echo "no summary at $S"; exit 1; }
          sudo cat "$S"
          sudo cat "$S" | python3 -I -c '
          import json, sys
          lines = sys.stdin.read().splitlines()
          assert len(lines) == 1, "summary is %d lines, not one" % len(lines)
          d = json.loads(lines[0])
          for k, v in (("config_source", "company"), ("run", "complete"), ("binary", "first_run")):
              assert d.get(k) == v, "%s is %r, not %r" % (k, d.get(k), v)
          print("summary OK: status=%s binary=%s" % (d["status"], d["binary"]))
          '
          if sudo test -e /home/fakeuser/.rosmarops/config.json; then echo "config.json was created"; exit 1; fi
          sha256sum -c "$RUNNER_TEMP/etc-before.sha256"
          for f in /etc/rosmarops/company.json /etc/rosmarops/binaries.sha256; do
            test "$(stat -c '%U %a' "$f")" = "root 644" || { echo "$f is no longer root 644"; exit 1; }
          done
      - name: Second unattended review (binary unchanged)
        shell: bash
        run: |
          set +e
          sudo -u fakeuser -H /usr/local/bin/rosmarops run --unattended
          rc=$?
          set -euo pipefail
          echo "exit code: $rc (recorded, not required to be 0)"
          S=/home/fakeuser/RosmarOps/data/rosmarops-summary.json
          sudo cat "$S"
          sudo cat "$S" | python3 -I -c '
          import json, sys
          lines = sys.stdin.read().splitlines()
          assert len(lines) == 1, "summary is %d lines, not one" % len(lines)
          d = json.loads(lines[0])
          for k, v in (("config_source", "company"), ("run", "complete"), ("binary", "unchanged")):
              assert d.get(k) == v, "%s is %r, not %r" % (k, d.get(k), v)
          print("summary OK: status=%s binary=%s" % (d["status"], d["binary"]))
          '
          if sudo test -e /home/fakeuser/.rosmarops/config.json; then echo "config.json was created"; exit 1; fi
          sha256sum -c "$RUNNER_TEMP/etc-before.sha256"

  company-scripts-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build rosmarops.exe (version 0.11.2, as install-windows.ps1)
        shell: powershell
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath "-ldflags=-X main.version=0.11.2" -o "$env:RUNNER_TEMP\rosmarops.exe" ./cmd/rosmarops
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
      - name: Install with docs/company/install-windows.ps1 and check what it left
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:INSTALLER_PATH = "$env:RUNNER_TEMP\rosmarops.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File docs/company/install-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-windows.ps1 exited $LASTEXITCODE" }
          $bin = Join-Path $env:ProgramFiles 'RosmarOps'
          $cfg = Join-Path $env:ProgramData 'RosmarOps'
          icacls $bin
          icacls $cfg
          icacls (Join-Path $cfg 'company.json')
          icacls (Join-Path $cfg 'binaries.sha256')
          Get-Content (Join-Path $cfg 'company.json')
          Get-Content (Join-Path $cfg 'binaries.sha256')
          $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $bin 'rosmarops.exe')).Hash.ToLower()
          $line = [IO.File]::ReadAllText((Join-Path $cfg 'binaries.sha256'))
          Write-Output "actual=$actual"
          if ($line -ne "$actual  0.11.2`n") { throw "binaries.sha256 is '$line', not '<sha>  0.11.2'" }
          $raw = [IO.File]::ReadAllBytes((Join-Path $cfg 'company.json'))
          if ($raw[0] -eq 0xEF) { throw "company.json starts with a BOM" }
          $task = Get-ScheduledTask -TaskName 'RosmarOps weekly review (company)'
          $task | Select-Object -ExpandProperty Principal | Format-List *
          $task | Select-Object -ExpandProperty Actions | Format-List Execute, Arguments, WorkingDirectory
          $task | Select-Object -ExpandProperty Triggers | Format-List *
          $pr = $task.Principal
          if ($pr.GroupId -ne 'S-1-5-32-545' -and $pr.GroupId -ne 'Users') { throw "task GroupId is '$($pr.GroupId)'" }
          if ("$($pr.RunLevel)" -ne 'Limited') { throw "task RunLevel is '$($pr.RunLevel)'" }
          if ($task.Actions[0].Execute -ne (Join-Path $bin 'rosmarops.exe')) { throw "task runs '$($task.Actions[0].Execute)'" }
          if ($task.Actions[0].Arguments -ne 'run --unattended') { throw "task arguments are '$($task.Actions[0].Arguments)'" }
      - name: Unattended review as the runner's user with no config.json (company configuration)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $profileDir = $env:USERPROFILE
          if (Test-Path (Join-Path $profileDir '.rosmarops')) {
            # The image already has a ~\.rosmarops: use a fresh profile folder.
            $profileDir = Join-Path $env:RUNNER_TEMP 'companyprofile'
            New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
            $env:USERPROFILE = $profileDir
            $env:HOME = $profileDir
          }
          Write-Output "profile: $profileDir"
          New-Item -ItemType Directory -Force -Path (Join-Path $profileDir 'source\demo') | Out-Null
          git -C (Join-Path $profileDir 'source\demo') init -q
          git -C (Join-Path $profileDir 'source\demo') -c user.email=a@b -c user.name=x commit -q --allow-empty -m x
          $cfgFile = Join-Path $profileDir '.rosmarops\config.json'
          if (Test-Path $cfgFile) { throw "$cfgFile exists before the review" }
          $before = Get-FileHash -Algorithm SHA256 (Join-Path $env:ProgramData 'RosmarOps\*') | ForEach-Object { "$($_.Hash) $($_.Path)" }
          & "$env:ProgramFiles\RosmarOps\rosmarops.exe" run --unattended
          # Recorded, not required to be 0: a yellow or red review may exit
          # non-zero, and the runner would otherwise end the step with it.
          Write-Output "exit code: $LASTEXITCODE (recorded, not required to be 0)"
          $global:LASTEXITCODE = 0
          $s = Join-Path $profileDir '.rosmarops\reports\data\rosmarops-summary.json'
          if (-not (Test-Path $s)) { throw "no summary at $s" }
          Get-Content $s
          $lines = @(Get-Content $s)
          if ($lines.Count -ne 1) { throw "summary is $($lines.Count) lines, not one" }
          $d = $lines[0] | ConvertFrom-Json
          if ($d.config_source -ne 'company') { throw "config_source is '$($d.config_source)'" }
          if ($d.run -ne 'complete') { throw "run is '$($d.run)'" }
          if ($d.binary -ne 'first_run') { throw "binary is '$($d.binary)'" }
          if (Test-Path $cfgFile) { throw "the review created $cfgFile" }
          $after = Get-FileHash -Algorithm SHA256 (Join-Path $env:ProgramData 'RosmarOps\*') | ForEach-Object { "$($_.Hash) $($_.Path)" }
          if (Compare-Object $before $after) { throw "the company folder changed during the review" }
          Write-Output "summary OK: status=$($d.status) binary=$($d.binary)"
      - name: Uninstall with docs/company/uninstall-windows.ps1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File docs/company/uninstall-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "uninstall-windows.ps1 exited $LASTEXITCODE" }
          if (Test-Path (Join-Path $env:ProgramFiles 'RosmarOps')) { throw "Program Files\RosmarOps is still there" }
          if (Test-Path (Join-Path $env:ProgramData 'RosmarOps')) { throw "ProgramData\RosmarOps is still there" }
          if (Get-ScheduledTask -TaskName 'RosmarOps weekly review (company)' -ErrorAction SilentlyContinue) { throw "the scheduled task is still there" }
          Write-Output "uninstalled"
