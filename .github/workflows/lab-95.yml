# Temporary laboratory, LECTURA-97: what does each agent write to disk on its
# FIRST launch, WITHOUT signing in? LECTURA-95 showed that merely installing
# Claude Code and Cursor writes no config, so RosmarOps detects nothing. Here,
# on a clean Windows runner, each agent is installed by its official route and
# then launched once without an account (no keys, no sign-in, no settings
# changed); the five config paths are listed (names, sizes, dates — never
# contents) before and after each launch; then the signed v0.3.0 rosmarops.exe
# (SHA-256 checked) runs and its report is uploaded. The job runs twice on fresh
# runners to check the result is identical. Temporary; lives only on lab-95.
name: lab-95
on:
  push:
    branches: [lab-95]
permissions:
  contents: read
jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: windows-latest
    steps:
      - name: Windows version
        shell: pwsh
        run: |
          cmd /c ver
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List | Out-String).Trim()

      - name: Install Claude Code (npm, official) and Cursor (winget, official)
        shell: pwsh
        continue-on-error: true
        run: |
          npm install -g "@anthropic-ai/claude-code"
          "claude: $(claude --version)"
          winget install --id Anysphere.Cursor -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          "cursor path: $(Get-Command cursor -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"

      - name: First launch without sign-in (snapshots before/after each step)
        shell: pwsh
        continue-on-error: true
        run: |
          $paths = @(
            "$env:USERPROFILE\.claude",
            "$env:USERPROFILE\.claude.json",
            "$env:USERPROFILE\.cursor",
            "$env:APPDATA\Cursor",
            "$env:APPDATA\Claude"
          )
          function Snapshot($label) {
            "===== SNAPSHOT: $label ====="
            foreach ($p in $paths) {
              if (Test-Path $p) {
                if ((Get-Item $p -Force).PSIsContainer) {
                  "DIR PRESENT: $p"
                  Get-ChildItem $p -Force -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                    Select-Object @{n='Rel';e={$_.FullName.Substring($p.Length)}}, Length, LastWriteTimeUtc |
                    Format-Table -AutoSize | Out-String
                } else {
                  $i = Get-Item $p -Force
                  "FILE PRESENT: $p  ($($i.Length) bytes, $($i.LastWriteTimeUtc) UTC)"
                }
              } else { "absent:  $p" }
            }
          }
          # Run a command with a hard time cap; never fail the step, capture all output.
          function Capped($label, $seconds, [scriptblock]$cmd) {
            "----- COMMAND: $label (cap ${seconds}s) -----"
            $job = Start-Job -ScriptBlock $cmd
            if (Wait-Job $job -Timeout $seconds) {
              "exit: completed"
              Receive-Job $job 2>&1 | Out-String
            } else {
              "exit: TIMEOUT after ${seconds}s (stopped)"
              Stop-Job $job
            }
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }

          Snapshot "before any launch"

          Capped "claude --version" 120 { claude --version 2>&1 }
          Snapshot "after claude --version"

          Capped "claude doctor" 120 { claude doctor 2>&1 }
          Snapshot "after claude doctor"

          Capped "claude -p hola (expected to fail: no session)" 120 { claude -p "hola" 2>&1 }
          Snapshot "after claude -p"

          # Cursor: launch the GUI exe, wait 90s, close it.
          "----- COMMAND: launch Cursor, wait 90s, close -----"
          $cursorExe = Join-Path $env:LOCALAPPDATA "Programs\cursor\Cursor.exe"
          if (Test-Path $cursorExe) {
            Start-Process -FilePath $cursorExe -PassThru | Out-Null
            Start-Sleep -Seconds 90
            Get-Process -Name "Cursor","cursor" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            "cursor launched and closed"
          } else {
            "cursor exe not found at $cursorExe"
          }
          Snapshot "after cursor launch"

      - name: Download rosmarops.exe v0.3.0 and verify SHA-256
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/qtorb/rosmarops/releases/download/v0.3.0/rosmarops.exe" -OutFile rosmarops.exe
          $want = "69f2f13f401d403a2c4e8f05f321ac600502e0176e98bd0d3f1e4c5c8f155696"
          $got = (Get-FileHash rosmarops.exe -Algorithm SHA256).Hash.ToLower()
          "want: $want"
          "got:  $got"
          if ($got -ne $want) { throw "SHA-256 mismatch: refusing to run (stop condition)" }

      - name: Run RosmarOps non-interactively (init + run)
        shell: pwsh
        continue-on-error: true
        run: |
          .\rosmarops.exe init
          .\rosmarops.exe run --lang en

      - name: Collect reports
        if: always()
        shell: pwsh
        run: |
          $reports = Join-Path $env:USERPROFILE ".rosmarops\reports"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (Test-Path $reports) {
            Copy-Item "$reports\*" out -Recurse -Force
            Get-ChildItem out -Recurse | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          } else {
            "no reports directory at $reports" | Tee-Object -FilePath out\NO_REPORTS.txt
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosmarops-run-${{ matrix.run }}
          path: out
          if-no-files-found: warn
