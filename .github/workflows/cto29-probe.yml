# CTO-29 temporary read-only probe. Installs Cursor with winget on a clean
# runner, never launches it, never logs in, and prints only product-code
# excerpts. This branch is deleted when the review is done; no PR.
name: cto29-probe
on:
  push:
    branches: [cto/2026-11-09-cto-29-probe]
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Install Cursor (no login, no launch)
        shell: pwsh
        run: winget install --id Anysphere.Cursor --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Read run-mode default from the installed files
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\cursor\resources\app'
          Write-Host "app dir exists: $(Test-Path $app)"
          $prod = Get-Content (Join-Path $app 'product.json') -Raw | ConvertFrom-Json
          Write-Host "product version: $($prod.version)  commit: $($prod.commit)"
          $w = Join-Path $app 'out\vs\workbench\workbench.desktop.main.js'
          Write-Host "workbench sha256: $((Get-FileHash $w -Algorithm SHA256).Hash.ToLower())  bytes: $((Get-Item $w).Length)"
          $s = [IO.File]::ReadAllText($w)
          $pats = @(
            'function vbb\(.{0,260}',
            'function _bb\(.{0,160}',
            'function Apb\(.{0,260}',
            'shouldUseSandboxBackedAutorunDefault\(\)\{.{0,500}'
          )
          foreach ($p in $pats) {
            $m = [regex]::Match($s, $p)
            Write-Host "---- /$p/ found=$($m.Success) at=$($m.Index)"
            if ($m.Success) { Write-Host $m.Value }
          }
          $schema = Join-Path $app 'extensions\cursor-always-local\schemas\permissions.schema.json'
          Write-Host "---- permissions.schema.json approvalMode"
          ((Get-Content $schema -Raw | ConvertFrom-Json).properties.approvalMode | ConvertTo-Json -Compress)
